name: Atualizar EPG Globo

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v3

      - name: Configurar o Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: pip install requests beautifulsoup4

      - name: Executar o script de atualização
        run: python atualizar.py

      - name: Salvar alterações no GitHub
        run: |
          git config --global user.name "Bot EPG"
          git config --global user.email "bot@users.noreply.github.com"
          git add globo.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Atualização automática da grade EPG" && git push)
